<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日主线任务</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#09091a;--bg2:#101022;--bg3:#161630;--bg4:#1c1c3a;
  --t1:#ede8f5;--t2:#a898c0;--t3:#5e5475;
  --purple:#9b8ec4;--teal:#7ab8a8;
  --exam:#d87080;--gold:#d8b870;
  --bd:rgba(155,142,196,0.14);--bd2:rgba(155,142,196,0.3);--r:10px;
  --sh-modal:rgba(0,0,0,.65);--overlay-bg:rgba(0,0,0,.55);
}
:root.light{
  --bg1:#f0f4f0;--bg2:#e6ede6;--bg3:#dae6da;--bg4:#cddccd;
  --t1:#1c2e24;--t2:#3d6650;--t3:#7a9e85;
  --purple:#6b4226;--teal:#4a8c7c;
  --exam:#963850;--gold:#9e8030;
  --bd:rgba(40,90,60,.16);--bd2:rgba(40,90,60,.32);
  --sh-modal:rgba(0,0,0,.12);--overlay-bg:rgba(0,0,0,.35);
}
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
body{background:var(--bg1);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;line-height:1.5;user-select:none}
h1,h2{font-family:'Crimson Pro',serif;font-weight:400}
body::before{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));position:fixed;top:0;left:0;right:0;z-index:200}

.wrap{max-width:1080px;margin:0 auto;padding:1.6rem 1.5rem 4rem}

/* HEADER */
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid var(--bd)}
.back-btn{background:none;border:none;color:var(--t3);font-size:.72rem;cursor:pointer;font-family:'Inter',sans-serif;padding:0;margin-bottom:.3rem;display:block;transition:color .15s;letter-spacing:.06em;text-transform:uppercase}
.back-btn:hover{color:var(--purple)}
.proj-name{font-family:'Crimson Pro',serif;font-size:1.9rem;letter-spacing:.02em;background:linear-gradient(135deg,var(--t1),var(--t2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.35rem}
#clock{font-family:'Crimson Pro',serif;font-size:1.9rem;color:var(--purple);letter-spacing:.06em;line-height:1}
.theme-toggle{font-size:.68rem;color:var(--t3);cursor:pointer;padding:3px 9px;border:1px solid var(--bd);border-radius:20px;background:transparent;font-family:'Inter',sans-serif;transition:all .2s;display:inline-block}
.theme-toggle:hover{border-color:var(--bd2);color:var(--t2)}
.fs-btn{font-size:.65rem;cursor:pointer;padding:3px 9px;border:1px solid var(--bd);border-radius:20px;background:transparent;font-family:'Inter',sans-serif;transition:all .2s;color:var(--t3);display:none}
.fs-btn:hover{border-color:var(--bd2);color:var(--t2)}

/* NAV ROW */
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.nav-btn{background:none;border:1px solid var(--bd);color:var(--t3);font-size:.78rem;cursor:pointer;padding:5px 16px;border-radius:20px;font-family:'Inter',sans-serif;transition:all .2s;letter-spacing:.04em}
.nav-btn:hover:not(:disabled){border-color:var(--bd2);color:var(--t1)}
.nav-btn:disabled{opacity:.25;cursor:default}
.nav-label{font-size:.72rem;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}

/* THREE-COLUMN LAYOUT */
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:2rem;align-items:start}

.col{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:1rem;min-height:200px;display:flex;flex-direction:column;gap:.75rem}
.col.is-today{border-color:rgba(155,142,196,.35);background:var(--bg3);box-shadow:0 0 0 1px rgba(155,142,196,.15)}
.col.is-tomorrow{border-color:rgba(122,184,168,.2)}
.col.is-past{opacity:.75}

.col-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:.65rem;border-bottom:1px solid var(--bd)}
.col-date-big{font-family:'Crimson Pro',serif;font-size:1.1rem;color:var(--t1)}
.col-date-sub{font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-top:.1rem}
.col.is-today .col-date-big{color:var(--purple)}
.col.is-tomorrow .col-date-big{color:var(--teal)}
.col-add-btn{background:none;border:1px solid rgba(155,142,196,.25);color:var(--t3);font-size:.65rem;cursor:pointer;padding:3px 9px;border-radius:14px;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;flex-shrink:0;margin-top:1px}
.col-add-btn:hover{border-color:var(--purple);color:var(--purple)}
.col.is-tomorrow .col-add-btn:hover{border-color:var(--teal);color:var(--teal)}

/* TIMELINE IN EACH COLUMN */
.col-timeline{display:flex;flex-direction:column;gap:.6rem;flex:1}
.col-empty{font-size:.72rem;color:var(--t3);font-style:italic;text-align:center;padding:.75rem 0}

.tl-item{position:relative;padding-left:18px}
.tl-item::before{content:'';position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--bd)}
.tl-item::after{content:'';position:absolute;left:0;top:13px;width:9px;height:9px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--bd2)}
.tl-item.done::after{background:var(--teal);border-color:var(--teal)}
.tl-item.overdue::after{border-color:var(--exam)}

.tl-card{background:var(--bg4);border-radius:7px;padding:.6rem .7rem}
.tl-item.done .tl-card{opacity:.5}

.tl-time{font-size:.6rem;color:var(--t3);letter-spacing:.07em;margin-bottom:.2rem}
.tl-item.overdue .tl-time{color:var(--exam)}
.tl-task{font-size:.78rem;color:var(--t1);line-height:1.35;margin-bottom:.25rem}
.tl-item.done .tl-task{text-decoration:line-through;color:var(--t3)}
.tl-notes{font-size:.67rem;color:var(--t3);font-style:italic;margin-bottom:.3rem;line-height:1.35}
.tl-reward{font-size:.67rem;color:var(--gold);margin-bottom:.45rem}
.tl-reward-lbl{font-size:.57rem;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.tl-actions{display:flex;gap:.35rem;align-items:center}
.tl-done-btn{padding:2px 10px;border-radius:5px;border:1px solid rgba(122,184,168,.3);background:transparent;color:var(--teal);font-size:.65rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.tl-done-btn:hover{background:rgba(122,184,168,.1);border-color:var(--teal)}
.tl-del-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:.7rem;padding:2px 4px;border-radius:4px;transition:color .15s;margin-left:auto}
.tl-del-btn:hover{color:var(--exam)}
.tl-done-tag{font-size:.62rem;color:var(--teal);letter-spacing:.04em}
.tl-plan-tag{font-size:.62rem;color:var(--t3);letter-spacing:.04em;font-style:italic}

/* REWARD POOL */
.pool-section{border-top:1px solid var(--bd);padding-top:1.5rem}
.pool-title{font-family:'Crimson Pro',serif;font-size:1.05rem;color:var(--t2);margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.pool-count{font-size:.7rem;color:var(--t3);font-family:'Inter',sans-serif}
.pool-empty{font-size:.75rem;color:var(--t3);font-style:italic;padding:.3rem 0}
.pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.55rem}
.reward-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;transition:border-color .15s}
.reward-item:hover{border-color:var(--bd2)}
.reward-icon{font-size:.9rem;flex-shrink:0}
.reward-body{flex:1;min-width:0}
.reward-text{font-size:.78rem;color:var(--t1);line-height:1.25}
.reward-meta{font-size:.58rem;color:var(--t3);margin-top:.1rem}
.redeem-btn{padding:2px 10px;border-radius:5px;border:1px solid rgba(216,184,112,.3);background:transparent;color:var(--gold);font-size:.65rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;flex-shrink:0}
.redeem-btn:hover{background:rgba(216,184,112,.1);border-color:var(--gold)}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:600;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--bg3);border:1px solid var(--bd2);border-radius:14px;padding:1.5rem;width:370px;max-width:calc(100vw - 2rem);box-shadow:0 20px 60px var(--sh-modal);animation:popIn .17s ease}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-title{font-family:'Crimson Pro',serif;font-size:1.15rem;color:var(--t1);margin-bottom:1rem}
.modal-title-sub{font-size:.65rem;color:var(--t3);font-family:'Inter',sans-serif;font-weight:400;margin-left:.5rem}
.modal-field{margin-bottom:.7rem}
.modal-label{font-size:.64rem;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:.28rem;display:block}
.modal-input,.modal-textarea{width:100%;background:var(--bg4);border:1px solid var(--bd);color:var(--t1);border-radius:7px;padding:.42rem .6rem;font-size:.78rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
.modal-input:focus,.modal-textarea:focus{border-color:var(--purple)}
.modal-textarea{resize:vertical;min-height:56px}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.modal-btn{padding:6px 16px;border-radius:7px;border:none;font-family:'Inter',sans-serif;font-size:.78rem;cursor:pointer;font-weight:500;transition:all .2s}
.modal-btn.primary{background:var(--purple);color:#fff}
.modal-btn.primary:hover{filter:brightness(1.15)}
.modal-btn.secondary{background:var(--bg4);color:var(--t3);border:1px solid var(--bd)}
.modal-btn.secondary:hover{color:var(--t2);border-color:var(--bd2)}

/* REDEEM CHAT */
.chat-reward-tag{font-size:.72rem;color:var(--gold);background:rgba(216,184,112,.08);border:1px solid rgba(216,184,112,.22);border-radius:6px;padding:.3rem .65rem;margin-bottom:.7rem}
.chat-history{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:.45rem;margin-bottom:.55rem;padding-right:.1rem}
.chat-msg{max-width:88%;padding:.42rem .65rem;border-radius:10px;font-size:.77rem;line-height:1.45;word-break:break-word}
.chat-msg.assistant{background:var(--bg4);color:var(--t1);align-self:flex-start;border-bottom-left-radius:3px}
.chat-msg.user{background:var(--purple);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.chat-typing{display:flex;gap:4px;padding:.3rem .2rem;align-items:center;align-self:flex-start}
.chat-typing-dot{width:5px;height:5px;border-radius:50%;background:var(--t3);animation:tdot 1.2s infinite}
.chat-typing-dot:nth-child(2){animation-delay:.2s}.chat-typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.chat-input-row{display:flex;gap:.4rem;margin-bottom:.5rem}
.api-key-note{font-size:.7rem;color:var(--t2);background:var(--bg4);border-radius:8px;padding:.6rem .75rem;line-height:1.6}

/* LINKED TASKS (from other projects) */
.linked-section{margin-top:.75rem;padding-top:.65rem;border-top:1px dashed var(--bd)}
.linked-hd{font-size:.58rem;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.45rem}
.linked-item{display:flex;align-items:flex-start;gap:.5rem;padding:.35rem .4rem;border-radius:6px;cursor:pointer;transition:background .15s}
.linked-item:hover{background:rgba(155,142,196,.06)}
.linked-cb{width:13px;height:13px;accent-color:var(--purple);cursor:pointer;flex-shrink:0;margin-top:3px}
.linked-badge{font-size:.55rem;font-weight:500;padding:1px 5px;border-radius:10px;color:#fff;white-space:nowrap;flex-shrink:0;margin-top:2px;opacity:.85}
.linked-body{flex:1;min-width:0}
.linked-course{font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-bottom:1px}
.linked-text{font-size:.72rem;color:var(--t2);line-height:1.3}
.linked-item.done .linked-text{text-decoration:line-through;color:var(--t3)}
.tl-task.editable{cursor:pointer}
.tl-task.editable:hover{color:var(--purple);text-decoration:underline;text-decoration-style:dotted}
.linked-body.editable{cursor:pointer}
.linked-body.editable:hover .linked-text{color:var(--purple)}
.linked-meta-ddl{font-size:.6rem;color:var(--t3);margin-top:.2rem}
.linked-meta-reward{font-size:.6rem;color:var(--gold);margin-top:.1rem}

@media(max-width:700px){.three-col{grid-template-columns:1fr}.col.is-past{display:none}}
</style>
</head>
<body>
<div style="height:3px"></div>
<div class="wrap">

<header>
  <div>
    <button class="back-btn" onclick="location.href='index.html'">← J人时刻</button>
    <h1 class="proj-name">每日主线任务</h1>
  </div>
  <div class="header-right">
    <div id="clock">--:--:--</div>
    <div style="display:flex;gap:.4rem;align-items:center">
      <button class="fs-btn" id="fsBtn" onclick="onFsBtnClick()">开启文件保存</button>
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">☀ Light</button>
    </div>
  </div>
</header>

<!-- NAV ROW -->
<div class="nav-row">
  <button class="nav-btn" id="prevBtn" onclick="shiftView(-1)">← 更早</button>
  <span class="nav-label" id="navLabel"></span>
  <button class="nav-btn" id="nextBtn" onclick="shiftView(1)">更晚 →</button>
</div>

<!-- THREE COLUMNS -->
<div class="three-col">
  <div class="col" id="col0">
    <div class="col-header">
      <div><div class="col-date-big" id="hd0"></div><div class="col-date-sub" id="sub0"></div></div>
    </div>
    <div class="col-timeline" id="tl0"></div>
  </div>
  <div class="col" id="col1">
    <div class="col-header">
      <div><div class="col-date-big" id="hd1"></div><div class="col-date-sub" id="sub1"></div></div>
      <button class="col-add-btn" id="add1" onclick="openAddModal(viewCenter)">+ 添加</button>
    </div>
    <div class="col-timeline" id="tl1"></div>
  </div>
  <div class="col" id="col2">
    <div class="col-header">
      <div><div class="col-date-big" id="hd2"></div><div class="col-date-sub" id="sub2"></div></div>
      <button class="col-add-btn" id="add2" onclick="openAddModal(tomorrow())">+ 计划</button>
    </div>
    <div class="col-timeline" id="tl2"></div>
  </div>
</div>

<!-- REWARD POOL — 暂时隐藏，代码保留，之后优化后再放回（去掉下面 display:none 即可恢复） -->
<div class="pool-section" style="display:none">
  <div class="pool-title">
    兑奖池 <span class="pool-count" id="poolCount"></span>
  </div>
  <div class="pool-grid" id="poolList"></div>
</div>

</div>

<!-- ADD TASK MODAL -->
<div id="addModal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeAddModal()">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">添加任务 <span class="modal-title-sub" id="modalDateLabel"></span></div>
    <div class="modal-field">
      <label class="modal-label">任务名称</label>
      <input type="text" id="addText" class="modal-input" placeholder="今天要做什么…" maxlength="120">
    </div>
    <div class="modal-field">
      <label class="modal-label">DDL（几点前完成）</label>
      <input type="time" id="addDdl" class="modal-input">
    </div>
    <div class="modal-field">
      <label class="modal-label">备注（可选）</label>
      <textarea id="addNotes" class="modal-textarea" placeholder="补充说明…"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label">完成后的 Reward</label>
      <input type="text" id="addReward" class="modal-input" placeholder="e.g. 去吃漂亮 brunch" maxlength="100">
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeAddModal()">取消</button>
      <button class="modal-btn primary" id="modalSubmitBtn" onclick="submitAdd()">添加</button>
    </div>
  </div>
</div>

<!-- LINKED TASK EDIT MODAL -->
<div id="linkedModal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeLinkedModal()">
  <div class="modal-box">
    <div class="modal-title">设置提醒 & Reward <span class="modal-title-sub" id="linkedModalSub"></span></div>
    <div style="font-size:.72rem;color:var(--t2);background:var(--bg4);border-radius:7px;padding:.45rem .6rem;margin-bottom:.85rem;line-height:1.4" id="linkedModalTask"></div>
    <div class="modal-field">
      <label class="modal-label">DDL（可选，几点前完成）</label>
      <input type="time" id="linkedDdl" class="modal-input">
    </div>
    <div class="modal-field">
      <label class="modal-label">完成后的 Reward（可选）</label>
      <input type="text" id="linkedReward" class="modal-input" placeholder="e.g. 去吃漂亮 brunch" maxlength="100">
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeLinkedModal()">取消</button>
      <button class="modal-btn primary" onclick="submitLinkedEdit()">保存</button>
    </div>
  </div>
</div>

<!-- REDEEM CHAT MODAL -->
<div id="redeemModal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeRedeemModal()">
  <div class="modal-box" style="width:450px">
    <div class="modal-title" style="margin-bottom:.5rem">回味时刻</div>
    <div class="chat-reward-tag">🎁 <span id="redeemRewardLbl"></span></div>
    <div id="apiKeySection" style="display:none">
      <div class="api-key-note">
        要启用 AI 聊天，请输入你的 Anthropic API Key（仅存本地，不会上传）
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="sk-ant-api03-…" style="margin-top:.45rem">
        <div style="display:flex;justify-content:flex-end;gap:.4rem;margin-top:.45rem">
          <button class="modal-btn secondary" onclick="redeemSkipAI()">直接兑现</button>
          <button class="modal-btn primary" onclick="saveApiKey()">保存并开始</button>
        </div>
      </div>
    </div>
    <div id="chatSection" style="display:none">
      <div class="chat-history" id="chatHistory"></div>
      <div class="chat-typing" id="chatTyping" style="display:none">
        <span class="chat-typing-dot"></span><span class="chat-typing-dot"></span><span class="chat-typing-dot"></span>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" class="modal-input" placeholder="回复…" style="flex:1">
        <button class="modal-btn primary" onclick="sendChatMsg()" style="padding:6px 14px;flex-shrink:0">→</button>
      </div>
      <div class="modal-actions" style="margin-top:.3rem">
        <button class="modal-btn secondary" onclick="redeemSkipAI()">直接兑现</button>
        <button class="modal-btn primary" id="saveRedeemBtn" onclick="saveAndRedeem()" disabled style="opacity:.45;cursor:default">记录并兑现</button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── PROJECT ─────────────────────────────────────────────────────────────────
const projectId = new URLSearchParams(location.search).get('project');
if (!projectId) { location.replace('index.html'); throw 0; }
document.title = '每日主线任务';

// ─── STORAGE ─────────────────────────────────────────────────────────────────
const DAYS_KEY        = projectId + '_days_v1';
const REWARDS_KEY     = projectId + '_rewards_v1';
const LINKED_META_KEY = projectId + '_linked_meta_v1';
let days       = {};
let rewards    = [];
let linkedMeta = {};  // key: "pid:taskId:date" → {ddl, reward}

function load(){
  const d = localStorage.getItem(DAYS_KEY);
  days = d ? JSON.parse(d) : {};
  const r = localStorage.getItem(REWARDS_KEY);
  rewards = r ? JSON.parse(r) : [];
  const lm = localStorage.getItem(LINKED_META_KEY);
  linkedMeta = lm ? JSON.parse(lm) : {};
}
function saveDays(){localStorage.setItem(DAYS_KEY, JSON.stringify(days));scheduleFsWrite();}
function saveRewards(){localStorage.setItem(REWARDS_KEY, JSON.stringify(rewards));scheduleFsWrite();}
function saveLinkedMeta(){localStorage.setItem(LINKED_META_KEY, JSON.stringify(linkedMeta));scheduleFsWrite();}

// ─── DATE HELPERS ─────────────────────────────────────────────────────────────
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return isoOf(new Date())}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return isoOf(d)}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d)}
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS_  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(iso){const d=new Date(iso+'T00:00:00');return MONTHS_[d.getMonth()]+' '+d.getDate();}
function fmtWday(iso){const d=new Date(iso+'T00:00:00');return WEEKDAYS[d.getDay()].toUpperCase();}
function isOverdue(ddl,date){
  if(date!==today())return false;
  const[h,m]=ddl.split(':').map(Number);const n=new Date();
  return n.getHours()>h||(n.getHours()===h&&n.getMinutes()>m);
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ─── VIEW STATE ───────────────────────────────────────────────────────────────
let viewCenter = today();   // always the center column date

function shiftView(delta){
  const next = addDays(viewCenter, delta);
  if(next > today()) return;         // never go past today in the center
  viewCenter = next;
  renderAll();
}

// ─── CLOCK ───────────────────────────────────────────────────────────────────
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent=
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
}
setInterval(updateClock,1000);updateClock();

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderAll(){
  const t = today();
  const tm = tomorrow();
  const dates = [addDays(viewCenter,-1), viewCenter, addDays(viewCenter,1)];
  // The right column is center+1 — but we cap display label at "明天" if it equals tomorrow()

  // Nav buttons
  document.getElementById('prevBtn').disabled = false;
  document.getElementById('nextBtn').disabled = (viewCenter >= t);
  document.getElementById('navLabel').textContent = fmtShort(dates[0]) + ' — ' + fmtShort(dates[2]);

  // Column classes & headers
  const cols = [0,1,2];
  cols.forEach(i=>{
    const iso = dates[i];
    const col = document.getElementById('col'+i);
    col.className = 'col';
    if(iso===t)col.classList.add('is-today');
    else if(iso===tm)col.classList.add('is-tomorrow');
    else if(iso<t)col.classList.add('is-past');

    // Header
    let bigLabel = fmtShort(iso);
    if(iso===t) bigLabel = 'Today · '+fmtShort(iso);
    else if(iso===tm) bigLabel = 'Tomorrow · '+fmtShort(iso);
    document.getElementById('hd'+i).textContent = bigLabel;
    document.getElementById('sub'+i).textContent = fmtWday(iso);

    // Add button visibility: col1 = center (today or past→ no button?), col2 = right
    if(i===1){
      const btn=document.getElementById('add1');
      // show + button if center is today or past (can add tasks to any non-future day... but past days are read-only)
      btn.style.display = (iso<=t) ? 'inline-block' : 'none';
      btn.onclick = ()=>openAddModal(iso);
    }
    if(i===2){
      const btn=document.getElementById('add2');
      // right column: can add if it's today or tomorrow (plan ahead), not if it's far future
      btn.style.display = (iso<=tm) ? 'inline-block' : 'none';
      btn.onclick = ()=>openAddModal(iso);
    }
  });

  // Render timelines
  cols.forEach(i => renderTimeline(dates[i], 'tl'+i));
  renderPool();
}

function renderTimeline(iso, containerId){
  const t = today();
  const tm = tomorrow();
  const tasks = (days[iso]||[]).slice().sort((a,b)=>a.ddl.localeCompare(b.ddl));
  const linked = getLinkedTasks(iso);
  const el = document.getElementById(containerId);
  const canComplete = (iso === t);
  const canAdd = (iso <= tm);
  const isPast = iso < t;
  let html = '';

  if(!tasks.length && !linked.length){
    const msg = isPast ? '无记录' : (iso===tm ? '暂无计划' : '今天还没有任务');
    el.innerHTML = '<div class="col-empty">'+msg+'</div>';
    return;
  }

  // Personal tasks (time-sorted)
  html += tasks.map(t_ => {
    const overdue = isOverdue(t_.ddl, iso);
    const cls = 'tl-item'+(t_.done?' done':'')+(overdue&&!t_.done?' overdue':'');
    let actions = '';
    if(canComplete && !t_.done){
      actions='<button class="tl-done-btn" onclick="completeTask(\''+iso+'\',\''+t_.id+'\')">完成</button>'
             +'<button class="tl-del-btn" onclick="deleteTask(\''+iso+'\',\''+t_.id+'\')" title="删除">✕</button>';
    } else if(t_.done){
      actions='<span class="tl-done-tag">✓ 已完成</span>';
    } else if(canAdd && !isPast){
      actions='<span class="tl-plan-tag">计划中</span>'
             +'<button class="tl-del-btn" onclick="deleteTask(\''+iso+'\',\''+t_.id+'\')" title="删除">✕</button>';
    } else {
      actions='<span class="tl-plan-tag">'+(t_.done?'✓':'·')+'</span>';
    }
    return '<div class="'+cls+'">'
      +'<div class="tl-card">'
      +'<div class="tl-time">⏰ '+escHtml(t_.ddl)+' 前</div>'
      +'<div class="tl-task'+(t_.done?'':' editable')+'"'+(t_.done?'':' onclick="openEditModal(\''+iso+'\',\''+t_.id+'\')"')+'>'+escHtml(t_.text)+'</div>'
      +(t_.notes?'<div class="tl-notes">'+escHtml(t_.notes)+'</div>':'')
      +'<div class="tl-reward"><span class="tl-reward-lbl">Reward </span>🎁 '+escHtml(t_.reward)+'</div>'
      +'<div class="tl-actions">'+actions+'</div>'
      +'</div></div>';
  }).join('');

  // Linked tasks from other projects
  if(linked.length){
    html += '<div class="linked-section"><div class="linked-hd">来自其他项目</div>';
    html += linked.map(lk => {
      const checked = lk.done ? ' checked' : '';
      const doneCls = lk.done ? ' done' : '';
      // checkbox is interactive for today and past (can fix yesterday's forgotten tasks), read-only for future
      const disabled = (iso > t) ? ' disabled' : '';
      const onChange = disabled ? '' : ' onchange="toggleLinkedTask(\''+lk.projectId+'\',\''+lk.taskId+'\',\''+iso+'\',this.checked)"';
      const metaKey_ = lk.projectId+':'+lk.taskId+':'+iso;
      const meta_ = linkedMeta[metaKey_]||{};
      return '<div class="linked-item'+doneCls+'">'
        +'<input type="checkbox" class="linked-cb"'+checked+disabled+onChange+'>'
        +'<span class="linked-badge" style="background:'+lk.projectColor+'">'+escHtml(lk.projectName)+'</span>'
        +'<div class="linked-body editable" onclick="openLinkedEditModal(\''+lk.projectId+'\',\''+lk.taskId+'\',\''+iso+'\')">'
        +(lk.course?'<div class="linked-course" style="color:'+lk.projectColor+'">'+escHtml(lk.course)+'</div>':'')
        +'<div class="linked-text">'+escHtml(lk.text)+'</div>'
        +(meta_.ddl?'<div class="linked-meta-ddl">⏰ '+escHtml(meta_.ddl)+' 前</div>':'')
        +(meta_.reward?'<div class="linked-meta-reward">🎁 '+escHtml(meta_.reward)+'</div>':'')
        +'</div></div>';
    }).join('');
    html += '</div>';
  }

  el.innerHTML = html;
}

function renderPool(){
  const pending = rewards.filter(r=>!r.redeemed);
  document.getElementById('poolCount').textContent = pending.length ? '('+pending.length+' 待兑现)' : '';
  const el = document.getElementById('poolList');
  if(!pending.length){el.innerHTML='<div class="pool-empty">暂无待兑现奖励</div>';return;}
  el.innerHTML = pending.map(r=>
    '<div class="reward-item">'
    +'<span class="reward-icon">🎁</span>'
    +'<div class="reward-body">'
    +'<div class="reward-text">'+escHtml(r.text)+'</div>'
    +'<div class="reward-meta">'+escHtml(r.taskText)+' · '+r.date+'</div>'
    +'</div>'
    +'<button class="redeem-btn" onclick="openRedeemModal(\''+r.id+'\')">兑现</button>'
    +'</div>'
  ).join('');
}

// ─── LINKED TASKS (cross-project) ────────────────────────────────────────────
const BUILTIN_CATS = {llm:'LLM',sno:'SNO',mc:'MC',sociology:'Sociology',ielts:'IELTS',other:'Other'};

function getLinkedTasks(date){
  const hub = JSON.parse(localStorage.getItem('jhub_projects_v1')||'[]');
  const result = [];
  hub.forEach(p=>{
    if(p.id===projectId||p.template==='daily') return;
    const raw = localStorage.getItem(p.id+'_plan_v7');
    if(!raw) return;
    let plan; try{plan=JSON.parse(raw);}catch(e){return;}
    const tasks = plan[date];
    if(!tasks||!tasks.length) return;
    const catsRaw = localStorage.getItem(p.id+'_cats_v1');
    let cats=[]; try{if(catsRaw)cats=JSON.parse(catsRaw);}catch(e){}
    tasks.forEach(t=>{
      const cat = (cats.find(c=>c.key===t.c)||{}).label || BUILTIN_CATS[t.c] || (t.c||'').toUpperCase();
      result.push({projectId:p.id, projectName:p.name, projectColor:p.color||'#9b8ec4', taskId:t.id, text:t.t, course:cat, done:t.done||false});
    });
  });
  return result;
}

function toggleLinkedTask(pid, taskId, date, isDone){
  const key = pid+'_plan_v7';
  const raw = localStorage.getItem(key);
  if(!raw) return;
  let plan; try{plan=JSON.parse(raw);}catch(e){return;}
  const tasks = plan[date]||[];
  const task = tasks.find(t=>t.id===taskId);
  if(!task) return;
  task.done = isDone;
  localStorage.setItem(key, JSON.stringify(plan));

  // Sync reward pool based on local meta
  const metaKey = pid+':'+taskId+':'+date;
  const meta = linkedMeta[metaKey]||{};
  if(isDone && meta.reward){
    const alreadyInPool = rewards.some(r=>r.taskId===taskId&&r.date===date&&r._pid===pid);
    if(!alreadyInPool){
      rewards.push({id:'r_'+Date.now(),text:meta.reward,taskText:task.t,date,taskId,_pid:pid,redeemed:false});
      saveRewards();
    }
  } else if(!isDone){
    const idx = rewards.findIndex(r=>r.taskId===taskId&&r.date===date&&r._pid===pid&&!r.redeemed);
    if(idx>=0){rewards.splice(idx,1);saveRewards();}
  }

  renderAll();
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function completeTask(iso, id){
  const tasks = days[iso]||[];
  const t = tasks.find(x=>x.id===id);
  if(!t||t.done)return;
  t.done=true;
  saveDays();
  rewards.push({id:'r_'+Date.now(),text:t.reward,taskText:t.text,date:iso,taskId:id,redeemed:false});
  saveRewards();
  renderAll();
}
function deleteTask(iso, id){
  if(!confirm('删除这个任务？'))return;
  days[iso]=(days[iso]||[]).filter(t=>t.id!==id);
  saveDays();
  renderAll();
}
function _markRedeemed(id, chat){
  const r=rewards.find(x=>x.id===id);
  if(!r)return;
  r.redeemed=true;
  r.redeemedAt=new Date().toISOString();
  if(chat&&chat.length) r.chat=chat;
  saveRewards();
  renderPool();
}

// ─── ADD / EDIT MODAL ────────────────────────────────────────────────────────
let addTargetDate = null;
let editMode = false;
let editTargetId = null;

function openAddModal(iso){
  editMode = false; editTargetId = null;
  addTargetDate = iso;
  const tm = tomorrow(); const t = today();
  let lbl = fmtShort(iso)+' ('+fmtWday(iso).charAt(0)+fmtWday(iso).slice(1).toLowerCase()+')';
  if(iso===t) lbl='今天'; else if(iso===tm) lbl='明天';
  document.getElementById('modalTitle').childNodes[0].textContent = '添加任务 ';
  document.getElementById('modalDateLabel').textContent = lbl;
  document.getElementById('modalSubmitBtn').textContent = '添加';
  document.getElementById('addText').value='';
  document.getElementById('addDdl').value='';
  document.getElementById('addNotes').value='';
  document.getElementById('addReward').value='';
  document.getElementById('addModal').style.display='flex';
  setTimeout(()=>document.getElementById('addText').focus(),50);
}
function openEditModal(iso, id){
  const task = (days[iso]||[]).find(t=>t.id===id);
  if(!task||task.done) return;
  editMode = true; editTargetId = id; addTargetDate = iso;
  const tm = tomorrow(); const t = today();
  let lbl = fmtShort(iso)+' ('+fmtWday(iso).charAt(0)+fmtWday(iso).slice(1).toLowerCase()+')';
  if(iso===t) lbl='今天'; else if(iso===tm) lbl='明天';
  document.getElementById('modalTitle').childNodes[0].textContent = '编辑任务 ';
  document.getElementById('modalDateLabel').textContent = lbl;
  document.getElementById('modalSubmitBtn').textContent = '保存';
  document.getElementById('addText').value = task.text;
  document.getElementById('addDdl').value = task.ddl;
  document.getElementById('addNotes').value = task.notes||'';
  document.getElementById('addReward').value = task.reward;
  document.getElementById('addModal').style.display='flex';
  setTimeout(()=>document.getElementById('addText').focus(),50);
}
function closeAddModal(){
  editMode = false; editTargetId = null;
  document.getElementById('addModal').style.display='none';
}
function submitAdd(){
  const text=document.getElementById('addText').value.trim();
  const ddl=document.getElementById('addDdl').value;
  const notes=document.getElementById('addNotes').value.trim();
  const reward=document.getElementById('addReward').value.trim();
  if(!text){document.getElementById('addText').focus();return;}
  if(!ddl){document.getElementById('addDdl').focus();return;}
  if(!reward){document.getElementById('addReward').focus();return;}
  if(editMode && editTargetId){
    const task=(days[addTargetDate]||[]).find(t=>t.id===editTargetId);
    if(task){task.text=text;task.ddl=ddl;task.notes=notes;task.reward=reward;}
  } else {
    if(!days[addTargetDate])days[addTargetDate]=[];
    days[addTargetDate].push({id:'t_'+Date.now(),text,ddl,notes,reward,done:false});
  }
  saveDays();
  closeAddModal();
  renderAll();
}
document.getElementById('addText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target===document.getElementById('addText'))document.getElementById('addDdl').focus();});
document.getElementById('addReward').addEventListener('keydown',e=>{if(e.key==='Enter')submitAdd();});

// ─── LINKED TASK META MODAL ───────────────────────────────────────────────────
let linkedEditKey = null;
function openLinkedEditModal(pid, taskId, date){
  linkedEditKey = pid+':'+taskId+':'+date;
  const meta = linkedMeta[linkedEditKey]||{};
  const hub = JSON.parse(localStorage.getItem('jhub_projects_v1')||'[]');
  const proj = hub.find(p=>p.id===pid)||{};
  let taskText = taskId;
  const raw = localStorage.getItem(pid+'_plan_v7');
  if(raw){try{const plan=JSON.parse(raw);const ts=plan[date]||[];const tk=ts.find(t=>t.id===taskId);if(tk)taskText=tk.t;}catch(e){}}
  document.getElementById('linkedModalSub').textContent = proj.name||pid;
  document.getElementById('linkedModalTask').textContent = taskText;
  document.getElementById('linkedDdl').value = meta.ddl||'';
  document.getElementById('linkedReward').value = meta.reward||'';
  document.getElementById('linkedModal').style.display='flex';
  setTimeout(()=>document.getElementById('linkedDdl').focus(),50);
}
function closeLinkedModal(){linkedEditKey=null;document.getElementById('linkedModal').style.display='none';}
function submitLinkedEdit(){
  if(!linkedEditKey) return;
  const ddl=document.getElementById('linkedDdl').value;
  const reward=document.getElementById('linkedReward').value.trim();
  if(ddl||reward){linkedMeta[linkedEditKey]={ddl,reward};}
  else{delete linkedMeta[linkedEditKey];}
  saveLinkedMeta();
  closeLinkedModal();
  renderAll();
}
document.getElementById('linkedReward').addEventListener('keydown',e=>{if(e.key==='Enter')submitLinkedEdit();});

// ─── REDEEM CHAT ─────────────────────────────────────────────────────────────
let _redeemId = null, _chatMsgs = [], _chatRewardText = '';

function openRedeemModal(id){
  const r=rewards.find(x=>x.id===id);
  if(!r)return;
  _redeemId=id; _chatMsgs=[]; _chatRewardText=r.text;
  document.getElementById('redeemRewardLbl').textContent=r.text;
  document.getElementById('chatHistory').innerHTML='';
  document.getElementById('chatTyping').style.display='none';
  document.getElementById('chatInput').value='';
  const sb=document.getElementById('saveRedeemBtn');
  sb.disabled=true;sb.style.opacity='.45';sb.style.cursor='default';
  document.getElementById('redeemModal').style.display='flex';
  if(localStorage.getItem('j_anthropic_key')){
    document.getElementById('apiKeySection').style.display='none';
    document.getElementById('chatSection').style.display='block';
    _startChat();
  } else {
    document.getElementById('apiKeySection').style.display='block';
    document.getElementById('chatSection').style.display='none';
  }
}
function closeRedeemModal(){document.getElementById('redeemModal').style.display='none';}
function redeemSkipAI(){_markRedeemed(_redeemId,null);closeRedeemModal();}
function saveAndRedeem(){_markRedeemed(_redeemId,_chatMsgs);closeRedeemModal();}

function saveApiKey(){
  const k=document.getElementById('apiKeyInput').value.trim();
  if(!k)return;
  localStorage.setItem('j_anthropic_key',k);
  document.getElementById('apiKeySection').style.display='none';
  document.getElementById('chatSection').style.display='block';
  _startChat();
}

async function _startChat(){
  _chatMsgs.push({role:'user',content:'（开始）'});  // internal trigger, keeps msgs starting with user
  document.getElementById('chatTyping').style.display='flex';
  const reply=await _callClaude(_chatMsgs);
  document.getElementById('chatTyping').style.display='none';
  if(reply)_appendChatMsg('assistant',reply);
  setTimeout(()=>document.getElementById('chatInput').focus(),50);
}

async function sendChatMsg(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  _appendChatMsg('user',text);
  const sb=document.getElementById('saveRedeemBtn');
  sb.disabled=false;sb.style.opacity='1';sb.style.cursor='pointer';
  document.getElementById('chatTyping').style.display='flex';
  const reply=await _callClaude(_chatMsgs);
  document.getElementById('chatTyping').style.display='none';
  if(reply)_appendChatMsg('assistant',reply);
  document.getElementById('chatInput').focus();
}

function _appendChatMsg(role,text){
  const el=document.getElementById('chatHistory');
  const div=document.createElement('div');
  div.className='chat-msg '+role;
  div.textContent=text;
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
  _chatMsgs.push({role,content:text});
}

async function _callClaude(messages){
  const key=localStorage.getItem('j_anthropic_key');
  if(!key)return null;
  const system=`你是用户的私人日记小助手。用户完成任务后兑现了奖励：「${_chatRewardText}」。
用中文，以轻松朋友式的语气帮用户回味这段体验。根据奖励内容问有针对性的问题：吃饭→问味道/地点/同伴；休闲娱乐→问感受/收获；以此类推。每次只说1-2句，简短自然，不重复已问过的问题。`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:150,system,messages})
    });
    if(!res.ok){
      if(res.status===401){_appendChatMsg('assistant','（API Key 无效，请刷新页面重新输入）');localStorage.removeItem('j_anthropic_key');}
      else _appendChatMsg('assistant','（请求失败 '+res.status+'，可跳过直接兑现）');
      return null;
    }
    const data=await res.json();
    return data.content[0].text;
  }catch(e){
    _appendChatMsg('assistant','（网络错误，可跳过直接兑现）');
    return null;
  }
}
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChatMsg();});

// ─── FILE SYSTEM PERSISTENCE ─────────────────────────────────────────────────
const LAST_SAVED_KEY = projectId + '_last_saved';
const FS_DB = 'jhub_'+projectId+'_fsh', FS_STORE = 'h', FS_KEY_IDB = 'd';
let _fsHandle = null, _fsTimer = null;

function _idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(FS_DB,1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore(FS_STORE);
    r.onsuccess=e=>res(e.target.result);r.onerror=rej;
  });
}
async function _idbGet(){const db=await _idbOpen();return new Promise(res=>{db.transaction(FS_STORE).objectStore(FS_STORE).get(FS_KEY_IDB).onsuccess=e=>res(e.target.result);});}
async function _idbSet(v){const db=await _idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(FS_STORE,'readwrite');tx.objectStore(FS_STORE).put(v,FS_KEY_IDB).onsuccess=res;tx.onerror=rej;});}
async function _idbDel(){const db=await _idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(FS_STORE,'readwrite');tx.objectStore(FS_STORE).delete(FS_KEY_IDB).onsuccess=res;tx.onerror=rej;});}

function _fsAllData(){return {days,rewards,linkedMeta,savedAt:new Date().toISOString()};}

async function _fsWrite(){
  if(!_fsHandle)return;
  try{
    const w=await _fsHandle.createWritable();
    await w.write(JSON.stringify(_fsAllData(),null,2));
    await w.close();
    localStorage.setItem(LAST_SAVED_KEY,new Date().toISOString());
  }catch(e){
    if(e.name==='NotFoundError'){await _clearFsHandle();}
  }
}
function scheduleFsWrite(){clearTimeout(_fsTimer);_fsTimer=setTimeout(_fsWrite,800);}

async function _clearFsHandle(){_fsHandle=null;await _idbDel();_setFsBtn('reconnect');}

function _setFsBtn(state){
  const btn=document.getElementById('fsBtn');
  btn.style.display='inline-block';
  if(state==='on'){btn.textContent='✓ 文件保存中';btn.style.color='var(--teal)';}
  else if(state==='reconnect'){btn.textContent='⚠ 重新连接';btn.style.color='var(--exam)';}
  else{btn.textContent='开启文件保存';btn.style.color='';}
}

function _applyData(data){
  if(data.days)days=data.days;
  if(data.rewards)rewards=data.rewards;
  if(data.linkedMeta)linkedMeta=data.linkedMeta;
}

async function onFsBtnClick(){
  if(_fsHandle){await reloadFromPicker();return;}
  try{
    const handle=await window.showSaveFilePicker({
      suggestedName:'daily-data.json',
      types:[{description:'JSON',accept:{'application/json':['.json']}}]
    });
    try{
      const file=await handle.getFile();const text=await file.text();
      if(text.trim()){const data=JSON.parse(text);if(data.days||data.rewards){_applyData(data);saveDays();saveRewards();saveLinkedMeta();}}
    }catch(e){}
    _fsHandle=handle;await _idbSet(handle);_setFsBtn('on');_fsWrite();
  }catch(e){if(e.name!=='AbortError')console.error(e);}
}

async function reloadFromPicker(){
  try{
    const [handle]=await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});
    const file=await handle.getFile();const text=await file.text();
    if(text.trim()){
      const data=JSON.parse(text);
      const fileSaved=data.savedAt?new Date(data.savedAt):null;
      const lsSaved=localStorage.getItem(LAST_SAVED_KEY)?new Date(localStorage.getItem(LAST_SAVED_KEY)):null;
      if(fileSaved&&lsSaved&&fileSaved<lsSaved){
        if(!confirm('文件保存时间早于本地数据，继续会用文件覆盖。确定？'))return;
      }
      _applyData(data);saveDays();saveRewards();saveLinkedMeta();
    }
    _fsHandle=handle;await _idbSet(handle);_setFsBtn('on');renderAll();
  }catch(e){if(e.name!=='AbortError')console.error(e);}
}

async function tryRestoreFromFile(){
  try{
    const handle=await _idbGet();
    if(!handle)return false;
    const file=await handle.getFile();
    const text=await file.text();
    if(!text.trim())return false;
    const data=JSON.parse(text);
    _applyData(data);
    _fsHandle=handle;_setFsBtn('on');
    return true;
  }catch(e){
    if(e.name==='NotFoundError')await _clearFsHandle();
    return false;
  }
}

// ─── THEME ───────────────────────────────────────────────────────────────────
function initTheme(){
  if(localStorage.getItem('bocconi_theme')==='light'){
    document.documentElement.classList.add('light');
    document.getElementById('themeBtn').textContent='☾ Dark';
  }
}
function toggleTheme(){
  const on=document.documentElement.classList.toggle('light');
  document.getElementById('themeBtn').textContent=on?'☾ Dark':'☀ Light';
  localStorage.setItem('bocconi_theme',on?'light':'dark');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
initTheme();
load();
_setFsBtn('off');
tryRestoreFromFile().then(()=>renderAll());
</script>
</body>
